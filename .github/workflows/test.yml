---
name: Test

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: behavior-and-static-analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats doxygen graphviz shellcheck shfmt

      - name: Synchronize repository dependencies
        run: make deps

      - name: Verify prepared dependency state
        run: make deps-check

      - name: Build distribution artifacts
        run: make build

      - name: Verify distribution artifact contract
        shell: bash
        run: |
          expected=(
            upload_sarif_to_defectdojo.dev.bash
            upload_sarif_to_defectdojo.dev.bash.sha256
            upload_sarif_to_defectdojo.bash
            upload_sarif_to_defectdojo.bash.sha256
            upload_sarif_to_defectdojo.min.bash
            upload_sarif_to_defectdojo.min.bash.sha256
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#sorted_expected[@]}"
          diff \
            <(printf '%s\n' "${sorted_expected[@]}") \
            <(printf '%s\n' "${actual[@]}")

          cd dist
          for checksum in *.bash.sha256; do
            sha256sum -c "${checksum}"
          done
          cd ..

          grep -F '# Generated by make build. Do not edit directly.' \
            dist/upload_sarif_to_defectdojo.dev.bash
          if tail -n +2 dist/upload_sarif_to_defectdojo.bash | grep -Eq '^[[:space:]]*#'; then
            printf '%s\n' 'ordinary artifact retained a full-line comment after the shebang' >&2
            exit 1
          fi
          if cmp -s \
            dist/upload_sarif_to_defectdojo.bash \
            dist/upload_sarif_to_defectdojo.min.bash; then
            printf '%s\n' 'minified artifact is byte-identical to ordinary artifact' >&2
            exit 1
          fi

          dist/upload_sarif_to_defectdojo.dev.bash --help >"${RUNNER_TEMP}/help.dev"
          dist/upload_sarif_to_defectdojo.bash --help >"${RUNNER_TEMP}/help.ordinary"
          dist/upload_sarif_to_defectdojo.min.bash --help >"${RUNNER_TEMP}/help.min"
          cmp "${RUNNER_TEMP}/help.dev" "${RUNNER_TEMP}/help.ordinary"
          cmp "${RUNNER_TEMP}/help.ordinary" "${RUNNER_TEMP}/help.min"

      - name: Verify deterministic build output
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.bash dist/*.bash.sha256 "${RUNNER_TEMP}/first-build/"
          make build
          for artifact in dist/*.bash dist/*.bash.sha256; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "${artifact}")" "${artifact}"
          done
          :

      - name: Verify ADR landing page generation
        shell: bash
        run: |
          marker='<!-- adrctl-generated-footer -->'
          prefix_digest() {
            awk -v marker="$marker" '{ print; if ($0 == marker) exit }' doc/adr/README.md |
              sha256sum |
              awk '{ print $1 }'
          }

          before_prefix="$(prefix_digest)"
          make adr-index
          after_prefix="$(prefix_digest)"
          first_digest="$(sha256sum doc/adr/README.md | awk '{ print $1 }')"

          make adr-index
          second_digest="$(sha256sum doc/adr/README.md | awk '{ print $1 }')"

          test "$before_prefix" = "$after_prefix"
          test "$first_digest" = "$second_digest"
          git diff --exit-code -- doc/adr/README.md

      - name: Generate reference documentation
        run: |
          make docs
          test -f doc/reference/index.html
          grep -R -F 'command_exists' doc/reference >/dev/null
          grep -R -F 'source_configuration_preserving_caller' doc/reference >/dev/null
          git check-ignore -q doc/reference/index.html
          test -z "$(git status --porcelain --untracked-files=all -- doc/reference)"

      - name: Check maintained Bash source
        run: make check

      - name: Run behavior tests against every artifact
        run: make test

      - name: Verify Bash 4.3 compatibility
        run: |
          for artifact in dist/*.bash; do
            docker run --rm \
              -v "${PWD}:/work:ro" \
              -w /work \
              bash:4.3 \
              bash -c 'bash -n "$1" && "$1" --help >/dev/null' _ "/work/${artifact}"
          done

      - name: Verify consumer artifacts are independent of vendor state
        run: |
          rm -rf vendor
          for artifact in dist/*.bash; do
            "${artifact}" --help >/dev/null
          done
          ./upload_sarif_to_defectdojo.bash --help >/dev/null

      - name: Upload distribution build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-sarif-to-defectdojo-build
          path: |
            dist/upload_sarif_to_defectdojo.dev.bash
            dist/upload_sarif_to_defectdojo.dev.bash.sha256
            dist/upload_sarif_to_defectdojo.bash
            dist/upload_sarif_to_defectdojo.bash.sha256
            dist/upload_sarif_to_defectdojo.min.bash
            dist/upload_sarif_to_defectdojo.min.bash.sha256
          if-no-files-found: error

      - name: Verify committed compatibility artifact
        shell: bash
        run: |
          normalized="${RUNNER_TEMP}/compat-normalized.bash"
          sed \
            -e 's/^UPLOAD_SARIF_VERSION=.*/UPLOAD_SARIF_VERSION=0.0.0-dev/' \
            -e 's/^UPLOAD_SARIF_BUILD_DATE=.*/UPLOAD_SARIF_BUILD_DATE=unknown/' \
            -e 's/^UPLOAD_SARIF_BUILD_COMMIT=.*/UPLOAD_SARIF_BUILD_COMMIT=unknown/' \
            dist/upload_sarif_to_defectdojo.bash >"${normalized}"
          cmp "${normalized}" upload_sarif_to_defectdojo.bash
          git diff --exit-code -- upload_sarif_to_defectdojo.bash

  pr-title:
    name: conventional-pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([[:alnum:]_.-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            printf 'Pull request title is not a Conventional Commit title: %s\n' "$PR_TITLE" >&2
            exit 1
          fi

  test_image:
    name: test_image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # pin@v6
        with:
          context: .
          push: false
          tags: upload-sarif-to-defectdojo:test

      - name: Smoke-test image help path
        run: docker run --rm upload-sarif-to-defectdojo:test --help >/dev/null
